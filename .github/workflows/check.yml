name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash scripts/green.sh
